<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#020803">
<title>MORPHEUS ANONYMOUS | Painel Imperial</title>
<style>
:root{--green:#19ff42;--green2:#00b928;--bg:#020503;--panel:#07100a;--line:#0d7e28;--muted:#a8b5aa}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#f3fff4;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(ellipse at 50% 0%,#073d16 0,#031008 34%,#010302 76%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(90deg,transparent 49%,#0dff3b 50%,transparent 51%),linear-gradient(transparent 49%,#0dff3b 50%,transparent 51%);background-size:46px 46px;mask-image:linear-gradient(to bottom,#000,transparent 75%)}
.wrap{width:min(760px,94vw);margin:22px auto 34px;position:relative}
.hero{position:relative;padding:0;border:1px solid #0d8d2c;border-radius:22px 22px 0 0;background:#000;box-shadow:0 0 28px #00ff3829,inset 0 0 30px #00ff3814;overflow:hidden}.hero img{display:block;width:100%;height:auto;max-height:700px;object-fit:contain;background:#000}
.kicker{font-size:11px;letter-spacing:4px;color:#a9ffb6}
.emblem{width:76px;height:76px;border:2px solid #b8d9bf;border-radius:50%;display:grid;place-items:center;margin:8px auto 10px;color:#fff;font-size:38px;background:radial-gradient(circle,#183b20,#020704 70%);box-shadow:0 0 18px #00ff49}
h1{margin:0;font-family:Georgia,serif;font-size:clamp(31px,8vw,58px);font-weight:900;letter-spacing:1px;line-height:.95;text-shadow:0 3px 0 #111,0 0 18px #00ff4c}
h1 span{display:block;color:var(--green);font-family:Arial,sans-serif;font-style:italic;letter-spacing:-1px}
.subtitle{margin:14px 0 0;color:#d7e7d9;letter-spacing:3px;font-size:12px;font-weight:bold}
.motto{position:absolute;left:15px;top:22px;text-align:left;font: bold 10px/1.6 Georgia,serif;letter-spacing:1px;color:#d8e4da}
.flag{position:absolute;right:18px;top:20px;font-size:32px}
.art{font-size:10px;color:#83a88b;letter-spacing:2px;margin-top:14px}
.panel{padding:22px 20px 20px;border:1px solid #0c8c2b;border-top:0;background:linear-gradient(145deg,rgba(3,18,8,.98),rgba(0,5,2,.98));box-shadow:0 0 30px #00ff3820;border-radius:0 0 22px 22px}
.section-title{text-align:center;text-transform:uppercase;font-weight:900;letter-spacing:2px;font-size:clamp(16px,4vw,22px);margin:0 0 18px}
.section-title span{color:var(--green)}
.field{display:flex;align-items:center;gap:12px;padding:0 16px;border:1px solid #286b38;border-radius:14px;background:#050b07;box-shadow:inset 0 0 14px #000;height:62px}
.field b{font-size:22px;color:#a7b5a9}
input{width:100%;border:0;outline:0;background:transparent;color:white;font-size:16px;min-width:0}
input::placeholder{color:#829087}
button{width:100%;border:0;border-radius:13px;padding:17px 12px;margin-top:13px;font-size:18px;font-weight:900;cursor:pointer;transition:transform .12s,filter .12s}
button:active{transform:scale(.985);filter:brightness(.9)}
.primary{background:linear-gradient(#5aff70,#00d52d 55%,#00a922);color:#001b06;box-shadow:0 0 18px #00ff4b66,inset 0 1px 2px #d6ffdc}
.secondary{background:linear-gradient(#ffe75b,#f6bb00);color:#191300;box-shadow:0 0 15px #ffc4003d}
.danger{background:linear-gradient(#ff6868,#d90000);color:white;box-shadow:0 0 15px #ff000044}
.result{display:none;margin-top:15px;padding:14px;border:1px solid #177b2e;border-radius:12px;background:#06140a;color:#d9ffe0;line-height:1.5;font-size:14px}
.result.show{display:block}
.note{margin:15px 0 0;text-align:center;color:#a8b5aa;font-size:12px}
.links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
.links a{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;text-decoration:none;color:#effff2;font-weight:bold;border:2px solid #18d948;border-radius:14px;background:#031008;box-shadow:0 0 14px #00ff3830}
.links a:last-child{border-color:#00cfff;box-shadow:0 0 14px #00cfff2b}
.links strong{font-size:23px}
footer{text-align:center;color:#6f8c75;font-size:10px;letter-spacing:1.5px;margin:18px 0 0}
@media(max-width:440px){.wrap{width:94vw;margin:12px auto 22px}.hero{padding:20px 10px 16px}.motto{font-size:8px;left:9px;top:14px}.flag{right:10px;top:13px;font-size:25px}.panel{padding:19px 14px}.links{grid-template-columns:1fr}.subtitle{font-size:10px}}
</style>
</head>

  <section class="panel">
    <h2 class="section-title">CONSULTA DE <span>NÚMERO</span></h2>
    <label class="field">
      <b aria-hidden="true">☎</b>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="Digite o número (ex.: 5511999999999)" maxlength="20">
    </label>
    <button class="primary" id="validate">⌕ &nbsp; Validar número</button>
    <button class="secondary" id="copy">▣ &nbsp; Copiar número</button>
    <button class="danger" id="clear">✕ &nbsp; Limpar consulta</button>
    <div class="result" id="result" role="status" aria-live="polite"></div>
    <p class="note">Sistema demonstrativo · A validação é local e não consulta dados pessoais.</p>
    <div class="links">
      <a href="https://www.whatsapp.com/" target="_blank" rel="noopener"><strong>◉</strong> WhatsApp <span>→</span></a>
      <a href="https://telegram.org/" target="_blank" rel="noopener"><strong>➤</strong> Telegram <span>→</span></a>
    </div>
  </section>
  <footer> MORPHEUS ANONYMOUS · AMBIENTE DE TESTE · RESPEITO E SEGURANÇA </footer>
</main>
<script>
const phone=document.getElementById('phone');
const result=document.getElementById('result');
function show(message){result.textContent=message;result.classList.add('show')}
document.getElementById('validate').addEventListener('click',()=>{
  const raw=phone.value.trim();
  const digits=raw.replace(/\D/g,'');
  if(!digits){show('Digite um número para iniciar a validação.');return}
  if(digits.length<10||digits.length>15){show('Formato inválido: informe entre 10 e 15 dígitos, incluindo o código do país quando necessário.');return}
  show('Formato válido: '+digits+'. Esta verificação confere apenas a quantidade de dígitos; não identifica o titular nem confirma se a linha está ativa.');
});
document.getElementById('copy').addEventListener('click',async()=>{
  const value=phone.value.trim();
  if(!value){show('Digite um número antes de copiar.');return}
  try{await navigator.clipboard.writeText(value);show('Número copiado.')}
  catch(e){phone.select();show('Selecione o número e use a opção Copiar do seu celular.')}
});
document.getElementById('clear').addEventListener('click',()=>{phone.value='';result.textContent='';result.classList.remove('show');phone.focus()});
phone.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('validate').click()});
</script>
