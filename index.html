<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020805">
<title>MORPHEUS ANONYMOUS</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:16px;
 background:radial-gradient(ellipse at top,#10351d,#020604 70%);
 color:#d8ffe1;font-family:Arial,sans-serif;
}
.container{max-width:720px;margin:auto}
header{text-align:center;padding:24px 8px}
header h1{font-size:27px;color:#36ff75;letter-spacing:2px}
header p{color:#9affae;font-size:12px;letter-spacing:3px}
.flag{font-size:32px}
.card{
 background:#07140c;border:1px solid #176d36;
 border-radius:15px;padding:19px;margin:16px 0;
 box-shadow:0 0 18px #00ff4020;
}
h2{font-size:17px;color:#4dff82;margin:0 0 12px}
input{
 width:100%;padding:15px;margin:9px 0;
 border:1px solid #247c40;border-radius:9px;
 background:#020905;color:#caffd5;font-size:15px;
}
button{
 width:100%;padding:14px;margin-top:9px;
 border:1px solid #39ff75;border-radius:9px;
 background:#0b351a;color:#65ff91;
 font-weight:bold;font-size:14px;cursor:pointer;
}
button:active{transform:scale(.98)}
button:disabled{opacity:.5;cursor:not-allowed}
.result{
 background:#020905;border:1px solid #15552b;
 border-radius:9px;padding:13px;margin-top:12px;
 line-height:1.8;overflow-wrap:anywhere;
}
.track{height:17px;background:#15271b;border-radius:20px;
 overflow:hidden;margin-top:18px}
.bar{height:100%;width:0%;background:#39ff75;
 box-shadow:0 0 12px #39ff75;transition:width .05s}
.counter{text-align:center;margin-top:12px;color:#64ff8d}
.small{font-size:12px;color:#83b991}
.codeitem{
 padding:11px;margin:9px 0;background:#020905;
 border:1px solid #176d36;border-radius:8px;
 display:flex;justify-content:space-between;
 gap:8px;align-items:center;overflow-wrap:anywhere
}
.codeitem button{width:auto;margin:0;padding:9px}
footer{text-align:center;color:#398c54;font-size:12px;padding:20px}
</style>
</head>
<body>
<div class="container">

<header>
 <div class="flag">🇧🇷</div>
 <h1>MORPHEUS ANONYMOUS</h1>
 <p>TERMINAL • SISTEMA • ACESSO</p>
</header>

<!-- 01 - NÚMERO -->
<section class="card">
 <h2>01 / NÚMERO</h2>
 <input id="numero" type="tel"
 placeholder="55 + DDD + telefone">
 <button onclick="consultarNumero()">CONSULTAR RESULTADO</button>
 <div class="result" id="resultadoNumero">
  Aguardando número...
 </div>
</section>

<!-- 02 - PUXADA DE CÓDIGO -->
<section class="card">
 <h2>02 / PUXADA DE CÓDIGO</h2>
 <button onclick="puxarCodigos()">PUXAR CÓDIGOS</button>
 <div id="codigos"></div>
</section>

<!-- 03 - SPAM -->
<section class="card">
 <h2>03 / SPAM</h2>
 <button id="spamBotao" onclick="iniciarSpam()">SPAM</button>
 <div class="track">
  <div class="bar" id="barraSpam"></div>
 </div>
 <div class="counter">
  <strong id="contadorSpam">0</strong> / 10.000
 </div>
 <p class="small" id="statusSpam"></p>
</section>

<!-- 04 - INFORMAÇÕES -->
<section class="card">
 <h2>04 / PAINEL DE INFORMAÇÕES</h2>
 <div class="result" id="infoPainel">
  Sistema pronto para uso.
 </div>
 <button onclick="mostrarSistema()">VER STATUS DO SISTEMA</button>
</section>

<footer>MORPHEUS ANONYMOUS • 🇧🇷</footer>
</div>

<script>
// CONSULTA DE FORMATO DO NÚMERO
function consultarNumero(){
 const numero=document.getElementById("numero").value.trim();
 const resultado=document.getElementById("resultadoNumero");
 const digitos=numero.replace(/\D/g,"");

 if(digitos.length<10 || digitos.length>13){
  resultado.textContent="Digite um número com DDD válido.";
  return;
 }
 resultado.innerHTML=
  "<strong>Número:</strong> "+numero+"<br>"+
  "<strong>Formato:</strong> Número informado<br>"+
  "<strong>Titular cadastrado:</strong> Não disponível<br>"+
  "<strong>Status cadastral:</strong> Não consultado<br>"+
  "<strong>Operadora:</strong> Não consultada";
}

// GERAÇÃO DE CÓDIGOS FICTÍCIOS
function puxarCodigos(){
 const area=document.getElementById("codigos");
 const letras="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
 area.innerHTML="";

 for(let i=0;i<8;i++){
  let codigo="DEMO-";
  for(let j=0;j<4;j++)
   codigo+=letras[Math.floor(Math.random()*letras.length)];
  codigo+="-";
  for(let j=0;j<4;j++)
   codigo+=letras[Math.floor(Math.random()*letras.length)];

  const linha=document.createElement("div");
  linha.className="codeitem";

  const texto=document.createElement("span");
  texto.textContent=codigo;

  const copiar=document.createElement("button");
  copiar.textContent="COPIAR";
  copiar.onclick=()=>{
   if(navigator.clipboard){
    navigator.clipboard.writeText(codigo)
     .then(()=>copiar.textContent="COPIADO")
     .catch(()=>copiar.textContent="COPIE MANUALMENTE");
   }else{
    copiar.textContent="COPIE MANUALMENTE";
   }
  };

  linha.append(texto,copiar);
  area.appendChild(linha);
 }
}

// BARRA VISUAL ATÉ 10.000
let rodando=false;

function iniciarSpam(){
 if(rodando)return;

 const numero=document.getElementById("numero").value.trim();
 if(!numero){
  alert("Digite primeiro o número na parte superior.");
  return;
 }

 rodando=true;
 let atual=0;
 const meta=10000;

 const barra=document.getElementById("barraSpam");
 const contador=document.getElementById("contadorSpam");
 const status=document.getElementById("statusSpam");
 const botao=document.getElementById("spamBotao");

 botao.disabled=true;
 barra.style.width="0%";
 contador.textContent="0";
 status.textContent="";

 const intervalo=setInterval(()=>{
  atual=Math.min(atual+100,meta);
  barra.style.width=(atual/meta*100)+"%";
  contador.textContent=atual.toLocaleString("pt-BR");

  if(atual>=meta){
   clearInterval(intervalo);
   status.textContent="Processo visual concluído!";
   rodando=false;
   botao.disabled=false;
  }
 },50);
}

// STATUS DO PAINEL
function mostrarSistema(){
 document.getElementById("infoPainel").innerHTML=
  "<strong>Status:</strong> ONLINE<br>"+
  "<strong>Painel:</strong> MORPHEUS ANONYMOUS<br>"+
  "<strong>Interface:</strong> Ativa<br>"+
  "<strong>Ambiente:</strong> Demonstração";
}
</script>
</body>
</html>
